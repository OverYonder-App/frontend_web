name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    # Dummy public env so the build can construct the Supabase client. These are
    # NOT secrets and never connect anywhere; static pages don't fetch at build.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key-for-build
      NEXT_PUBLIC_APP_URL: https://example.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test

      # SENTRY_AUTH_TOKEN (add it as a repo secret: Settings → Secrets and
      # variables → Actions) lets the build upload source maps so Sentry shows
      # readable stack traces. Safe no-op if the secret is unset. org/project
      # default to gerald-ux / javascript-nextjs in next.config.ts.
      - name: Build
        run: npm run build
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
